name: Security Linter

on:
  pull_request:
    types: [ opened, synchronize, reopened, ready_for_review ]
    branches:
    - main
    - dev
  push:
    branches:
    - main
    - dev
  workflow_dispatch:


permissions: {}

env:
  HUSKY: 0

jobs:
  security-linter:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
    - name: Checkout code
      uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      with:
        clean: true
        persist-credentials: false

    - name: Setup Node.js
      uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
      with:
        node-version: '20'

    - name: Enable Corepack and prepare Yarn 1.x
      run: |
        corepack enable
        corepack prepare yarn@1.22.22 --activate

    - name: Install dependencies
      run: yarn install --frozen-lockfile

    - name: Run security linter
      run: |
        echo "Running security linter ..."
        # Use --no-eslintrc to ignore all other configs and only use our security config
        yarn eslint --no-eslintrc -c .eslintrc.security.json 'src/**/*.{js,ts}'
      # ESLint will exit 0 if only warnings, exit 1 if errors
